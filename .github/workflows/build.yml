name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc-mingw-w64-i686 python3-numpy
      - name: Build, tests and sanitizers
        run: make -j2 verify
      - name: Package
        run: make package
      - name: Keep test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nfsu2-driving-mods-prerelease
          path: dist/*
          if-no-files-found: error
          retention-days: 14
